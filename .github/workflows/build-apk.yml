name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  APP_DIR: DiscordBotRunner

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Python 3.10 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APP_DIR }}/android/.gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('DiscordBotRunner/android/**/*.gradle*', 'DiscordBotRunner/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Cache npm (app)
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: npm-app-${{ runner.os }}-${{ hashFiles('DiscordBotRunner/package-lock.json') }}

      - name: Install app dependencies
        run: npm ci
        working-directory: ${{ env.APP_DIR }}

      - name: Install Node bot runtime dependencies
        run: npm ci
        working-directory: ${{ env.APP_DIR }}/nodejs-assets/nodejs-project

      - name: Write local.properties
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> local.properties

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30